description: sento is a Munich-based B2B software company (sento GmbH) building a cloud-based
  EDI (Electronic Data Interchange) platform that automates complex business-partner processes,
  letting companies replace slow, manual partner-integration workflows with automated document
  and data exchange. Founded by Nimar Blume and Felix Krauth and backed by Insight Partners,
  sento raised a EUR 9 million seed round to expand its partner-onboarding and document-automation
  product. As of this profile sento does not publish a public developer API, developer portal,
  or API documentation - only its corporate marketing site and legal pages are publicly available.
